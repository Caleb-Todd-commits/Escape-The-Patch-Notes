<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Escape the Patch Notes: a platformer slowly ruined by updates."
    />
    <title>Escape the Patch Notes</title>
  </head>
  <body>
    <main id="app">
      <canvas id="game" width="960" height="540" aria-label="Escape the Patch Notes game canvas"></canvas>
      <div id="status" class="sr-only" aria-live="polite">Loading game</div>
      <input
        id="name-input"
        type="text"
        maxlength="24"
        autocomplete="off"
        spellcheck="false"
        placeholder="Enter your name"
        aria-label="Player name"
      />
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
